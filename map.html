<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050711">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>try{if(sessionStorage.getItem('bd1_fog'))document.documentElement.classList.add('fogin')}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="map.css">
<link rel="stylesheet" href="fog.css">
<title>Jornada dos Heróis</title>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<main class="map" id="map">
  <img class="base" src="map/base.webp" alt="Jornada dos Heróis" draggable="false">
  <div class="layer" id="grays"></div>
  <div class="layer" id="nodes"></div>
  <div class="quote" id="quote" aria-live="polite"><p class="q-t" id="q-t"></p><p class="q-a" id="q-a"></p></div>
</main>
<button class="reset" id="reset" type="button" aria-label="Reiniciar progresso">REINICIAR</button>
<a class="back" id="back" href="index.html">TROCAR DE GRUPO</a>
<section class="panel" id="panel" hidden>
  <div class="p-title" id="p-title"></div>
  <div class="p-sub" id="p-sub"></div>
  <button class="p-go" id="p-go" type="button">ENTRAR <b>0/1</b></button>
</section>
<div class="confirm" id="confirm" hidden><div class="c-box"><div class="c-t">REINICIAR PROGRESSO?</div><div class="c-s">A jornada volta ao começo, como se nenhum boss tivesse sido derrotado.</div><div class="c-b"><button id="c-yes" type="button">REINICIAR</button><button id="c-no" type="button">CANCELAR</button></div></div></div>
<div class="fog top" id="fogT"></div><div class="fog bot" id="fogB"></div>
<div class="veil" id="veil"></div>
<script src="fog.js"></script>
<script src="lobby.js"></script>
<script src="hud.js"></script>
<script src="map.js"></script>
<script src="quotes.js"></script>
<script src="mapfx.js"></script>
</body>
</html>
