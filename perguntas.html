<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0816">
<link rel="manifest" href="manifest.webmanifest">
<title>Painel de Perguntas</title>
<style>
@font-face{font-family:'Pixelify Sans';font-weight:500;src:url(assets/fonts/pixelify-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-weight:700;src:url(assets/fonts/pixelify-sans-latin-700-normal.woff2) format('woff2')}
:root{--bg:#0a0816;--card:#141028;--line:#3a3158;--gold:#ffc54e;--ink:#eee5f7;--mut:#9a90b8;--d1:#8fd8ff;--d2:#8fe39a;--d3:#ffb35c;--d4:#c79bff;--d5:#ffe14d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.35 'Pixelify Sans',monospace}
body{padding:14px 16px 60px;max-width:760px;margin:0 auto}
h1{font-size:22px;color:var(--gold);margin:6px 0 2px;letter-spacing:.06em}
.sub{color:var(--mut);margin:0 0 12px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button,input{font:inherit;color:var(--ink)}
button{appearance:none;cursor:pointer;background:#1a1430;border:1px solid #6b5a2e;border-radius:6px;padding:8px 12px;letter-spacing:.04em;-webkit-tap-highlight-color:transparent}
button:active{background:#2c2250}
button.chip{padding:6px 11px;border-color:var(--line)}
button.chip.on{border-color:var(--gold);color:var(--gold)}
button.dng{border-color:#8a3040;color:#ff9aa8}
button.onb{border-color:#2f7a48;color:#a8f0bf}
input{background:#0e0a20;border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
.q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.q.off{opacity:.55}
.q .top{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.rk{font-weight:700;min-width:30px;text-align:center;padding:2px 6px;border-radius:4px;border:1px solid currentColor;font-size:13px}
.rk.d1{color:var(--d1)}.rk.d2{color:var(--d2)}.rk.d3{color:var(--d3)}.rk.d4{color:var(--d4)}.rk.d5{color:var(--d5)}
.tema{color:var(--mut);font-size:12px;flex:1}
.q p{margin:0 0 6px}
.q ol{margin:0;padding-left:20px;color:var(--mut);font-size:13px}
.q li.right{color:#8fe39a;font-weight:700}
.q .act{display:flex;gap:8px;margin-top:8px}
.msg{padding:8px 10px;border-radius:6px;margin:8px 0;font-size:13px;background:#2a1020;border:1px solid #8a3040;color:#ffb0bc}
.msg.ok{background:#10281a;border-color:#2f7a48;color:#a8f0bf}
.st{color:var(--mut);font-size:12px;margin:2px 0 8px}
.st b.low{color:#ff9aa8}
</style>
</head>
<body>
<div class="bar" style="margin-top:0"><button id="back" type="button">&#9666; ESPECTAR</button><span id="net" class="st" style="align-self:center">conectando</span></div>
<h1>PAINEL DE PERGUNTAS</h1>
<p class="sub">Perguntas que valem nas salas online. Desativar tira a pergunta do sorteio; cada rank mantém pelo menos 3 ativas. Para criar ou editar o texto, use o editor.</p>
<div id="msg"></div>
<div class="bar" id="chips"></div>
<div class="st" id="stat"></div>
<div class="bar"><input id="search" placeholder="Buscar no texto ou no tema" autocomplete="off"></div>
<div id="list"></div>
<script src="js/vendor/supabase.js"></script>
<script src="js/online/net.js"></script>
<script>
const R = ['C','B','A','S','SS'];
let counts = {}, list = [], filter = 0, busy = false, tm = 0;
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function say(t, ok) { $('#msg').innerHTML = t ? '<div class="msg' + (ok ? ' ok' : '') + '">' + esc(t) + '</div>' : ''; }
function chips() {
  const tot = r => { const c = counts[r] || {on: 0, off: 0}; return c.on + c.off; };
  const all = [1,2,3,4,5].reduce((n, r) => n + tot(r), 0);
  $('#chips').innerHTML = '<button class="chip' + (!filter ? ' on' : '') + '" data-f="0">TODAS (' + all + ')</button>' + R.map((n, i) => '<button class="chip' + (filter === i + 1 ? ' on' : '') + '" data-f="' + (i + 1) + '">' + n + ' (' + tot(i + 1) + ')</button>').join('');
  $('#stat').innerHTML = R.map((n, i) => { const c = counts[i + 1] || {on: 0, off: 0}; return n + ' <b' + (c.on <= 3 ? ' class="low"' : '') + '>' + c.on + ' ativas</b>' + (c.off ? ' · ' + c.off + ' off' : ''); }).join(' &nbsp; ');
}
function paint() {
  chips();
  $('#list').innerHTML = list.length ? list.map(q => '<div class="q' + (q.active ? '' : ' off') + '" data-id="' + esc(q.id) + '"><div class="top"><span class="rk d' + q.rank + '">' + R[q.rank - 1] + '</span><span class="tema">' + esc(q.theme || '') + (q.active ? '' : ' · DESATIVADA') + '</span></div><p>' + esc(q.text) + '</p><ol type="A">' + (q.options || []).map((o, i) => '<li' + (i === q.correct ? ' class="right"' : '') + '>' + esc(o) + '</li>').join('') + '</ol><div class="act"><button class="' + (q.active ? 'dng' : 'onb') + '" data-a="' + (q.active ? 'off' : 'on') + '">' + (q.active ? 'DESATIVAR' : 'ATIVAR') + '</button></div></div>').join('') : '<p class="sub">Nenhuma pergunta encontrada.</p>';
}
async function load() {
  // v341: o servidor devolve no maximo 150 por pedido; em TODAS, pede um rank de cada vez para listar o banco inteiro (200+ perguntas)
  try { await NET.ready(); const q = $('#search').value.trim() || null;
    const rs = await Promise.all((filter ? [filter] : [1, 2, 3, 4, 5]).map(rk => NET.rpc('admin_question_list', { p_rank: rk, p_q: q })));
    counts = rs[0].counts || {}; list = [].concat(...rs.map(r => r.list || [])); $('#net').textContent = 'online'; paint(); }
  catch (e) { $('#net').textContent = 'sem servidor'; say(NET.msg(e)); }
}
$('#chips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filter = Number(b.dataset.f); load(); });
$('#search').addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(load, 350); });
$('#list').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || busy) return; busy = true; b.disabled = true;
  try { await NET.rpc('admin_question_set', { p_id: b.closest('.q').dataset.id, p_active: b.dataset.a === 'on' }); say(b.dataset.a === 'on' ? 'Pergunta ativada.' : 'Pergunta desativada.', true); await load(); }
  catch (x) { say(/minimo_de_perguntas/.test(String(x && x.message)) ? 'Este rank já está no mínimo de 3 perguntas ativas.' : NET.msg(x)); b.disabled = false; }
  busy = false;
});
$('#back').onclick = () => { location.href = 'espectar.html' + location.search; };
(async () => {
  let adm = false; try { await NET.ready(); adm = await NET.isAdmin(); } catch (e) {}
  if (!adm) { location.replace('cover.html' + location.search); return; }
  load();
})();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }));
</script>
</body>
</html>
