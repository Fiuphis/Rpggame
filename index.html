<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050711">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>try{if(!sessionStorage.getItem('bd1_cover')&&!sessionStorage.getItem('bd1_fog_lobby')&&!/[?&]nocover/.test(location.search)){location.replace('cover.html'+location.search)}
if(sessionStorage.getItem('bd1_fog_lobby'))document.documentElement.classList.add('fogin');if(sessionStorage.getItem('bd1_rebuild'))document.documentElement.classList.add('rb');if(sessionStorage.getItem('bd1_gate'))document.documentElement.classList.add('gt')}catch(e){}</script>
<style>html.rb::after{content:"";position:fixed;inset:0;background:#050308;z-index:9998}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/lobby.css">
<link rel="stylesheet" href="css/fog.css">
<title>Selecione sua classe</title>
<script src="js/core/gate.js"></script>
</head>
<body>
<div class="fog top" id="fogT"></div><div class="fog bot" id="fogB"></div>
<main class="stage" id="stage">
  <img class="bg" src="assets/backgrounds/select_plate.webp" alt="Selecione sua classe" draggable="false">
</main>
<div class="above" id="above"><div class="ab-title"></div>
  <button id="home" class="home" type="button">&#9666; SALAS</button>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <button id="confirm" class="confirm" type="button" disabled>ESCOLHA UMA CLASSE</button>
</div>
<style>html.gt::after{content:"";position:fixed;inset:0;background:#050308;z-index:9998}.rmchip{position:absolute;right:3cqw;top:2.2cqw;font:700 2.6cqw var(--F,monospace);color:#e8dcb0;letter-spacing:.1em;padding:1.4cqw 2.4cqw;background:rgba(10,6,16,.7);border:2px solid #6e5a2c;pointer-events:none}</style>
<script src="js/vendor/supabase.js"></script>
<script src="js/online/net.js"></script>
<script src="js/online/match.js"></script>

<script src="js/core/fog.js"></script>
<script src="js/pages/lobby.js"></script>
<script>
const W=1024,H=1536;
// box = área do card (arte inclusa), frame = moldura, cnt = onde fica o "n/7" (cobre o 0/7 da arte)
const A={"mage": {"box": [90, 252, 502, 810], "frame": [95, 335, 497, 806], "yp": 592, "em": [292, 589, 31], "char": [103.0, 252.31, 386, 396.0], "panel": [90, 552, 412, 260]}, "guerreiro": {"box": [520, 255, 934, 810], "frame": [524, 335, 930, 806], "yp": 592, "em": [722, 592, 31], "char": [532.0, 227.52, 390, 420.67], "panel": [520, 555, 414, 257]}, "tank": {"box": [90, 812, 502, 1334], "frame": [95, 842, 497, 1332], "yp": 1110, "em": [297, 1116, 33], "char": [103.0, 750.28, 386, 416.0], "panel": [90, 1077, 412, 259]}, "cleriga": {"box": [520, 816, 934, 1334], "frame": [524, 845, 930, 1332], "yp": 1110, "em": [735, 1116, 35], "char": [532.0, 817.07, 390, 390.0], "panel": [520, 1075, 414, 261]}};
const CARDS=[
  {key:'mage',    cnt:[405,620,47,28],  bg:'#010618', fg:'#bee5f7'},
  {key:'guerreiro',  cnt:[840,620,47,28],  bg:'#06050a', fg:'#f9f7f6'},
  {key:'tank',    cnt:[405,1136,47,28], bg:'#010610', fg:'#f3f5f8'},
  {key:'cleriga',cnt:[840,1136,47,28], bg:'#060609', fg:'#faf9f7'}
];
const R=window.NET&&NET.room();let RC=null;
const _lc=LOBBY.counts.bind(LOBBY);LOBBY.counts=()=>RC?{...RC}:_lc();
if(R){const pull=async()=>{try{const a=await NET.counts(R.id),o={mage:0,guerreiro:0,tank:0,cleriga:0};for(const k in a)o[k]=a[k];RC=o;render()}catch(e){}};
 pull();setInterval(pull,3000);
 const ab0=document.getElementById('above'),ch=document.createElement('div');ch.className='rmchip';ch.textContent=(R.pub?'SALA ':'SALA PRIVADA ')+R.code;ab0.appendChild(ch)}
const stage=document.getElementById('stage'), msg=document.getElementById('msg'), confirmBtn=document.getElementById('confirm');
const pc=(v,t)=>(v/t*100)+'%';
let SVA=null;try{SVA=JSON.parse(sessionStorage.getItem('bd1_save'))}catch(e){}
let selected=LOBBY.myGroup()||(SVA&&SVA.cls)||null;
const els={};
CARDS.forEach(c=>{
  const a=A[c.key], [x,y,x2,y2]=a.box, w=x2-x, h=y2-y, G=LOBBY_GROUPS[c.key];
  const [fx,fy,fx2,fy2]=a.frame, [cx,cy,cw,ch]=c.cnt, [hx,hy,hw,hh]=a.char, [px_,py,pw,ph]=a.panel;
  const gx=fx-3-x, gy=fy-3-y, gw=fx2-fx+6, gh=fy2-fy+6;
  const clipTop=((a.yp-(fy-3))/gh*100).toFixed(3);
  const pos=(l,t,ww,hh_)=>`left:${pc(l,w)};top:${pc(t,h)};width:${pc(ww,w)};height:${pc(hh_,h)}`;
  const b=document.createElement('button'); b.type='button'; b.className='card'; b.setAttribute('aria-label',G.name);
  b.style.cssText=(c.key==='mage'||c.key==='guerreiro'?'clip-path:inset(-2px -80px -80px -80px);':'')+`left:${pc(x,W)};top:${pc(y,H)};width:${pc(w,W)};height:${pc(h,H)};--c:${G.color}`;
  b.innerHTML=`<span class="tint" style="${pos(fx-x,fy-y,fx2-fx,fy2-fy)}"></span>
    <span class="glow gb" style="${pos(gx,gy,gw,gh)}"></span>
    <img class="char" src="assets/class-select/char_${c.key}.webp" alt="" draggable="false" style="${pos(hx-x,hy-y,hw,hh)}">
    <img class="panel" src="assets/class-select/panel_${c.key}.webp" alt="" draggable="false" style="${pos(px_-x,py-y,pw,ph)}">
    <span class="glow gf" style="${pos(gx,gy,gw,gh)};clip-path:inset(${clipTop}% -60px -60px -60px)"></span>
    <span class="cnt" style="${pos(cx-x,cy-y,cw,ch)};background:${c.bg};color:${c.fg}"></span>`;
  b.onclick=()=>choose(c.key);
  const ch_=b.querySelector('.char');
  ch_.addEventListener('animationend',()=>ch_.classList.remove('hop-in','hop-out'));
  stage.appendChild(b); els[c.key]={b,ch:ch_,cnt:b.querySelector('.cnt')};
});
function say(t){msg.textContent=t;msg.classList.add('show');clearTimeout(window.__m);window.__m=setTimeout(()=>msg.classList.remove('show'),2200)}
function hop(key,cls){const b=els[key].ch;b.classList.remove('hop-in','hop-out');void b.offsetWidth;b.classList.add(cls)}
function choose(g){
  const counts=LOBBY.counts(), mine=LOBBY.myGroup();
  if(counts[g]>=LOBBY_MAX && mine!==g){say('Essa classe está cheia.');return}
  if(selected===g){selected=null;hop(g,'hop-out')}          // tocar de novo desfaz a seleção
  else{ if(selected)hop(selected,'hop-out'); selected=g; hop(g,'hop-in') }
  render();
}
function render(){
  const counts=LOBBY.counts(), mine=LOBBY.myGroup();
  CARDS.forEach(c=>{
    const g=c.key, n=counts[g], full=n>=LOBBY_MAX && mine!==g;
    if(selected===g && full) selected=null;
    const preview=selected===g && mine!==g, shown=preview?n+1:n;
    const {b,cnt}=els[g];
    b.classList.toggle('selected',selected===g); b.classList.toggle('full',full);
    cnt.textContent=`${shown}/${LOBBY_MAX}`;
    cnt.classList.toggle('green',preview); cnt.classList.toggle('red',full);
  });
  confirmBtn.disabled=!selected;
  confirmBtn.style.setProperty('--c',selected?LOBBY_GROUPS[selected].color:'#6e6580');
  confirmBtn.textContent=selected?`CONFIRMAR: ${LOBBY_GROUPS[selected].name}`:'ESCOLHA UMA CLASSE';
  if(typeof waitMode==='function')waitMode();
}
let LB=null;
const ONLINE=!!(R&&!NET.MOCK&&window.MATCH);
function goMap(){
  if(window.__leaving)return;window.__leaving=true;
  document.body.classList.add('leaving');sessionStorage.setItem('bd1_fog','1');
  setTimeout(()=>{Fog.close(document.getElementById('stage'),1000).then(()=>{location.href='map.html'+location.search})},520);   /* os botões somem antes das nuvens fecharem */
}
/* online: depois de confirmar a classe a pessoa fica nesta tela; só o criador vê o botão do mapa, e só quando todos da sala já escolheram */
function waitMode(){
  if(!ONLINE||!LB||!LB.me||selected!==LB.me)return false;
  const all=LB.total>0&&LB.picked>=LB.total;
  if(LB.stage==='map'){confirmBtn.style.setProperty('--c',LOBBY_GROUPS[selected].color);confirmBtn.disabled=false;confirmBtn.textContent='VOLTAR AO MAPA';return true}
  confirmBtn.style.setProperty('--c',LOBBY_GROUPS[selected].color);
  if(LB.owner){ if(all){confirmBtn.disabled=false;confirmBtn.textContent='IR PARA O MAPA'}else{confirmBtn.disabled=true;confirmBtn.textContent='AGUARDANDO TODOS ('+LB.picked+'/'+LB.total+')'} }
  else{confirmBtn.disabled=true;confirmBtn.textContent=all?'AGUARDANDO O CRIADOR':'AGUARDANDO TODOS ('+LB.picked+'/'+LB.total+')'}
  return true;
}
let BACK=false;try{BACK=sessionStorage.getItem('bd1_from_map')==='1';sessionStorage.removeItem('bd1_from_map')}catch(e){}   /* veio do botão voltar do mapa: não volta sozinho para lá */
if(ONLINE){const pull=async()=>{try{LB=await MATCH.lobby(R.id);if(LB.stage==='map'&&LB.me&&!BACK&&selected===LB.me)goMap();else render()}catch(e){}};pull();setInterval(pull,1500)}
confirmBtn.onclick=async()=>{
  if(!selected||confirmBtn.dataset.b)return;
  if(waitMode()){ if(LB.stage==='map'){goMap();return} if(LB.owner&&LB.total>0&&LB.picked>=LB.total){confirmBtn.dataset.b='1';try{await MATCH.stage(R.id,'map');goMap()}catch(e){say(NET.msg(e))}delete confirmBtn.dataset.b} return; }
  try{sessionStorage.setItem('bd1_pref_class',selected)}catch(e){}
  if(R){confirmBtn.dataset.b='1';try{await NET.pickGroup(R.id,selected)}catch(e){delete confirmBtn.dataset.b;say(NET.msg(e));selected=null;render();return}delete confirmBtn.dataset.b}
  const r=LOBBY.join(selected);
  if(!r.ok){say(r.reason==='full'?'Essa classe acabou de lotar.':'Classe inválida.');selected=null;render();return}
  if(ONLINE){try{LB=await MATCH.lobby(R.id)}catch(e){}render();return}
  document.body.classList.add('leaving');sessionStorage.setItem('bd1_fog','1');setTimeout(()=>{Fog.close(document.getElementById('stage'),1000).then(()=>{location.href='map.html'+location.search})},520);
};
const goHome=()=>{
  if(window.__leaving)return;window.__leaving=true;
  try{sessionStorage.removeItem('bd1_rebuild');sessionStorage.setItem('bd1_gate','1')}catch(e){}
  if(R)try{sessionStorage.setItem('bd1_leave_room',R.id)}catch(e){}
  LOBBY.leave();
  const go=()=>location.href='salas.html';
  if(window.Gate&&!matchMedia('(prefers-reduced-motion: reduce)').matches)Gate.close().then(go);else go();
};
document.getElementById('home').onclick=goHome;
// botão voltar do aparelho = INÍCIO (vai para as salas, sem sair do jogo por engano)
try{history.pushState({idx:1},'')}catch(e){}
addEventListener('popstate',()=>{if(window.__leaving){try{history.pushState({idx:1},'')}catch(e){}return}goHome()});
addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
render();
if(window.Gate)Gate.arrive();
const _st=document.getElementById('stage');
if(sessionStorage.getItem('bd1_fog_lobby')){sessionStorage.removeItem('bd1_fog_lobby');setTimeout(()=>Fog.open(_st,2600),700)}else Fog.rest(_st);
addEventListener('resize',()=>{if(!document.documentElement.classList.contains('fogin'))Fog.rest(_st)});
(()=>{const ab=document.getElementById('above'),sync=()=>{const r=_st.getBoundingClientRect();ab.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`};sync();addEventListener('resize',sync);addEventListener('load',sync);addEventListener('pageshow',sync);if(window.ResizeObserver)new ResizeObserver(sync).observe(_st)})();
window.addEventListener('storage',render);
if('serviceWorker' in navigator){navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='updated')location.reload()});window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}))}
</script>
<script src="js/core/rebuild.js"></script>
<script src="js/core/fs.js"></script>
</body>
</html>
