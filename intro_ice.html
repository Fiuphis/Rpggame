<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abertura do Hrimgar</title><link rel="stylesheet" href="css/style.css">
<style>body{margin:0;background:#05080f;color:#cfe9ff;font:14px OpenC,OpenD,monospace;display:flex;align-items:center;justify-content:center;height:100vh}button{font:inherit;color:#e8f7ff;background:#0f3a63;border:1px solid #9fd6ff;padding:12px 18px;cursor:pointer}</style></head>
<body><button id="go" type="button">REPRODUZIR ABERTURA DO HRIMGAR</button>
<script src="js/game/intro_ice.js"></script>
<script>
const run = () => IntroIce.play({voters:1, need:1, onReveal:() => {}}).then(() => { document.getElementById('go').hidden = false; });
document.getElementById('go').onclick = e => { e.target.hidden = true; run(); };
if (new URLSearchParams(location.search).get('auto')) document.getElementById('go').click();
</script></body></html>
