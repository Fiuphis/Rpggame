<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050308">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<script>try{if(sessionStorage.getItem('bd1_cover_back'))document.documentElement.classList.add('rb')}catch(e){}</script>
<style>html.rb::after{content:"";position:fixed;inset:0;background:#050308;z-index:9998}</style>
<link rel="stylesheet" href="cover.css">
<title>Crônicas do Saber</title>
</head>
<body>
<img class="blurbg" src="cover_bg.webp" alt="" draggable="false">
<main id="cv">
  <div id="world">
    <img id="art" src="cover_bg.webp" alt="Crônicas do Saber: seis reinos, seis lendas, um só destino" draggable="false">
    <div id="fxd"></div>
    <canvas id="fx"></canvas>
  </div>
  <div id="ui">
    <a class="chip corner l" href="editor.html">EDITOR DE PERGUNTAS</a>
    <button id="upd" class="chip corner r" type="button">↻ ATUALIZAR</button>
    <div class="dock" id="dock">
      <button id="play" class="c-play" type="button"><span>JOGAR</span></button>
      <button id="how-btn" class="c-how" type="button"><i class="ic-book"></i><span>COMO JOGAR</span></button>
      <button id="sv-btn" class="c-sv" type="button"><span>SAVES<small id="sv-act">SAVE 1</small></span></button>
      <button id="auto" class="c-auto" type="button" aria-pressed="false"><span>TESTE DESLIGADO</span></button>
      <div class="c-msg" aria-live="polite"><i class="ic-gem"></i><p id="msg"></p></div>
    </div>
  </div>
  <div id="sv" class="how sv" hidden role="dialog" aria-modal="true" aria-label="Saves">
    <div class="hw">
      <div class="hw-head"><svg class="ic-save" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><path fill="#ffd978" d="M0 1h1V0h9v1h1v1h1v9h-1v1H1v-1H0z"/><path fill="#6a4a10" d="M2 1h7v4H2z"/><path fill="#ffe9a8" d="M7 1h1v3H7z"/><path fill="#1a1530" d="M2 7h8v4H2z"/><path fill="#8a6a1a" d="M3 8h6v1H3z"/></svg><b>SAVES</b></div>
      <p class="sv-note">O jogo usa o save em uso. Progresso, moedas e itens ficam guardados nele.</p>
      <div class="hw-body" id="sv-body"></div>
      <p id="sv-msg" class="sv-msg" aria-live="polite"></p>
      <button id="sv-close" class="chip close" type="button">FECHAR</button>
    </div>
  </div>
  <div id="how" class="how" hidden role="dialog" aria-modal="true" aria-label="Como jogar">
    <div class="hw">
      <div class="hw-head"><i class="ic-book"></i><b>COMO JOGAR</b></div>
      <div class="hw-tabs" id="tabs"></div>
      <div class="hw-body" id="hbody"></div>
      <div class="hw-foot"><button id="prev" class="chip" type="button">ANTERIOR</button><span id="pg" class="pg"></span><button id="next" class="chip" type="button">PRÓXIMO</button></div>
      <button id="hclose" class="chip close" type="button">FECHAR</button>
    </div>
  </div>
</main>
<canvas id="px"></canvas>
<script src="rebuild.js"></script>
<script src="saves.js"></script>
<script src="cover.js"></script>
</body>
</html>
