<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050711">
<title>Mosaico</title>
<style>
html,body{margin:0;height:100%;background:#050711;color:#fff1c8;font:700 13px/1.2 OpenC,OpenD,monospace;overflow:hidden}
#hd{position:fixed;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:8px;padding:0 8px;background:#0a0816;border-bottom:2px solid #c9a24a;z-index:5}
#hd b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
#hd button{font:inherit;color:#e8c46a;background:#1d1636;border:1px solid #c9a24a;padding:6px 10px;cursor:pointer}
#gr{position:fixed;left:0;right:0;top:40px;bottom:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px}
.c{position:relative;overflow:hidden;background:#000}
.c iframe{position:absolute;left:0;top:0;width:390px;height:780px;border:0;transform-origin:0 0}
.c button{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;cursor:pointer;z-index:2}
#msg{position:fixed;inset:40px 0 0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#cfc4e6}
</style>
</head>
<body>
<div id="hd"><button id="x" type="button">&#9666; VOLTAR</button><b id="t">MOSAICO</b></div>
<div id="gr"></div><div id="msg" hidden></div>
<script src="js/vendor/supabase.js"></script>
<script src="js/online/net.js"></script>
<script src="js/pages/mosaico.js"></script>
</body>
</html>
