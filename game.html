<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#050711">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Banco de Dados I — RPG</title>
</head>
<body>
<div class="skel-layer" aria-hidden="true">
<img class="sk t" src="skel/skel_2.png" alt="" draggable="false" style="--x:5.9;--s:19;--r:172deg;--f:1;--o:18px;--d:10.6s;--dl:-10.9s">
<img class="sk t" src="skel/skel_3.png" alt="" draggable="false" style="--x:19.3;--s:16;--r:188deg;--f:1;--o:26px;--d:6.9s;--dl:-6.8s">
<img class="sk t" src="skel/skel_1.png" alt="" draggable="false" style="--x:37.7;--s:16;--r:143deg;--f:1;--o:12px;--d:8.5s;--dl:-1.7s">
<img class="sk t" src="skel/skel_2.png" alt="" draggable="false" style="--x:47.7;--s:22;--r:171deg;--f:1;--o:18px;--d:7.2s;--dl:-8.5s">
<img class="sk t" src="skel/skel_1.png" alt="" draggable="false" style="--x:64.4;--s:19;--r:211deg;--f:-1;--o:26px;--d:9.0s;--dl:-3.0s">
<img class="sk t" src="skel/skel_3.png" alt="" draggable="false" style="--x:77.1;--s:19;--r:203deg;--f:-1;--o:26px;--d:8.5s;--dl:-11.8s">
<img class="sk t" src="skel/skel_1.png" alt="" draggable="false" style="--x:90.7;--s:26;--r:191deg;--f:-1;--o:26px;--d:6.8s;--dl:-8.0s">
<img class="sk b" src="skel/skel_2.png" alt="" draggable="false" style="--x:11.6;--s:22;--r:25deg;--f:-1;--o:6px;--d:12.4s;--dl:-11.3s">
<img class="sk b" src="skel/skel_3.png" alt="" draggable="false" style="--x:23.8;--s:16;--r:27deg;--f:-1;--o:18px;--d:11.5s;--dl:-10.6s">
<img class="sk b" src="skel/skel_1.png" alt="" draggable="false" style="--x:37.1;--s:26;--r:-26deg;--f:-1;--o:6px;--d:8.0s;--dl:-3.4s">
<img class="sk b" src="skel/skel_2.png" alt="" draggable="false" style="--x:53.4;--s:26;--r:9deg;--f:-1;--o:26px;--d:10.3s;--dl:-10.6s">
<img class="sk b" src="skel/skel_1.png" alt="" draggable="false" style="--x:67.9;--s:22;--r:28deg;--f:-1;--o:12px;--d:7.6s;--dl:-2.1s">
<img class="sk b" src="skel/skel_3.png" alt="" draggable="false" style="--x:78.4;--s:19;--r:33deg;--f:1;--o:18px;--d:8.5s;--dl:-1.7s">
<img class="sk b" src="skel/skel_1.png" alt="" draggable="false" style="--x:92.2;--s:22;--r:-21deg;--f:-1;--o:26px;--d:9.3s;--dl:-1.2s">
</div>
<div id="game" class="game">
  <img id="reference" src="game_nohud.png" alt="Banco de Dados I — tela de batalha" draggable="false">

  <!-- Efeitos: brilho do boss no ataque e flash de dano. -->
  <div id="fx" aria-hidden="true">
    <div class="boss-aura"></div>
    <div id="turn-ring" class="turn-ring" hidden></div>
    <div id="boss-impact" class="boss-impact"></div>
    <div id="damage-flash" class="damage-flash"></div>
  </div>

  <!-- Pixel-accurate transparent hit map. Coordinates are in the source image's 1024x1536 grid. -->
  <div id="hitmap" aria-label="Controles do jogo">
  </div>

  <!-- Moedas do grupo (cobre o número fixo da arte). -->
  <div id="gold-hud" class="gold-hud" aria-label="Moedas do grupo">10</div>


  <!-- Pergunta = ataque do boss. Só existe na tela durante o ataque. -->
  <section id="dynamic-ui" hidden>
    <div id="dynamic-question" class="dynamic-question">
      <img class="dq-frame" src="question_panel.png" alt="" draggable="false">
      <div id="dq-layer" class="dq-layer"></div>
    </div>
  </section>

  <!-- Menu de habilidades do herói: quadro de arte por herói + cartões clicáveis por cima. -->
  <section id="skill-menu" class="skm" hidden><img id="skm-frame" class="skm-frame" alt="" draggable="false"><div id="skm-layer" class="skm-layer"></div></section>

  <!-- Menu simples (escolha de alvo). -->
  <section id="action-menu" class="action-menu" hidden>
    <header class="am-head">
      <div class="am-who"><b id="am-title"></b><span id="am-text"></span></div>
      <div id="am-attack" class="dq-attack row"></div>
      <div id="am-timer"></div>
    </header>
    <div id="am-list" class="am-list"></div>
  </section>

  <!-- Inventário + Mercador: escondido; abre ao clicar no botão da borda inferior. -->
  <div id="bag-back" class="bag-back" hidden></div>
  <section id="bag-panel" class="bag-panel" hidden aria-label="Inventário e Mercador">
    <img src="bag_panel.png" alt="" draggable="false">
    <div id="inventory-hits"></div>
    <button class="hit shop hp1" data-action="buy" data-item="hp" aria-label="Comprar poção de HP"></button>
    <button class="hit shop hp2" data-action="buy" data-item="hp" aria-label="Comprar poção de HP"></button>
    <button class="hit shop mana1" data-action="buy" data-item="mana" aria-label="Comprar poção de mana"></button>
    <button class="hit shop mana2" data-action="buy" data-item="mana" aria-label="Comprar poção de mana"></button>
    <div id="merchant-vote" class="merchant-vote" aria-label="Mercador">
      <div class="merchant-title"><span></span><b id="merchant-timer"></b></div>
      <div class="merchant-body">
        <div id="merchant-question" class="merchant-question"></div>
        <div class="vote-row">
          <button class="vote-choice" data-action="vote" data-vote="yes"><span>SIM</span><b id="yes-count">0</b></button>
          <button class="vote-choice" data-action="vote" data-vote="no"><span>NÃO</span><b id="no-count">0</b></button>
        </div>
      </div>
    </div>
  </section>
  <button id="bag-toggle" class="bag-toggle" type="button" aria-label="Inventário e Mercador" aria-expanded="false"><img src="bag_button.png" alt=""></button>

  <button id="back-lobby" class="back-lobby" type="button" aria-label="Trocar de grupo">◀ GRUPOS</button>

  <div id="end-screen" class="end-screen" hidden>
    <div class="end-box"><h2></h2><p></p><button id="restart" type="button">JOGAR DE NOVO</button></div>
  </div>

  <div id="turn-banner" class="turn-banner" role="status" aria-live="polite"></div>

  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script src="lobby.js"></script>
<script src="menu_meta.js"></script>
<script src="mage.js"></script>
<script src="fxsoft.js"></script><script src="knight.js"></script><script src="tank.js"></script><script src="cleric.js"></script><script src="boss.js"></script>
<script src="anim.js"></script>
<script src="app.js"></script>
</body>
</html>
